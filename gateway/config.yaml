# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# The whole gateway policy for the lab. Three things happen here:
#   1. the caller must present a short-lived JWT that Vault signed (who is calling),
#   2. each tool call is checked against the rules below (what this caller may do),
#   3. the upstream key is added on the way to the MCP server (the agent never sees it).

config:
  logging:
    format: json

frontendPolicies:
  tracing:
    host: otel-collector:4317
    protocol: grpc
    randomSampling: true
  accessLog:
    add:
      tool_args: 'mcp.tool.arguments'
      tool_error: 'mcp.tool.error'
      caller: 'jwt.agent'
      caller_role: 'jwt.role'
      caller_sub: 'jwt.sub'

mcp:
  port: 3000
  policies:
    # Who is calling. The token is an identity token from Vault: signed with
    # Vault's key, issued for this gateway (aud), valid for five minutes. The
    # gateway holds no secret for this check, only Vault's public keys.
    jwtAuth:
      mode: strict
      issuer: http://vault:8200/v1/identity/oidc
      audiences: [mcp-gateway]
      jwks:
        url: http://vault:8200/v1/identity/oidc/.well-known/keys
      jwtValidationOptions:
        requiredClaims: [exp, sub]

    # Which tools exist for this caller. Any authenticated agent may read
    # logs; only an agent whose Vault entity has role=operator may restart.
    # read_logs is allowed for every environment on purpose: a gateway rule
    # that is too broad is the mistake test 3 relies on.
    mcpAuthorization:
      rules:
      - 'mcp.tool.name == "read_logs"'
      - 'mcp.tool.name == "restart_service" && jwt.role == "operator"'

    # Rules on tool ARGUMENTS. mcpAuthorization cannot see arguments, so the
    # prod restart rule is a request-phase guardrail.
    mcpGuardrails:
      processors:
      - kind: expression
        methods:
          tools/call: request
        condition: >-
          mcp.params.name == 'restart_service' &&
          has(mcp.params.arguments) &&
          has(mcp.params.arguments.env) &&
          mcp.params.arguments.env == 'prod'
        reject: "Denied by gateway policy: restart_service is not allowed with env=prod"

    backendAuth:
      key:
        value: $UPSTREAM_KEY
        location:
          header:
            name: x-api-key
            prefix: ""

  targets:
  - name: ops
    mcp:
      host: http://mcp-server:8000/mcp
