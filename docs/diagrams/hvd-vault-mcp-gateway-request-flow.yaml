# architecture.md "Request flow for one tool call". Badges are the steps of the numbered list.
figure:
  stem: hvd-vault-mcp-gateway-request-flow
  title: "Figure 2: Request flow for one tool call"
  alt: >-
    The agent logs in to Vault with AppRole and gets an identity token (1), then sends tools/call to
    agentgateway (2). Inside the gateway, jwtAuth checks the token against Vault's public keys (3),
    mcpGuardrails checks the arguments (4), and mcpAuthorization checks the tool (5). The gateway forwards the
    call to the MCP server with x-api-key (6). The MCP server checks the upstream key (7). The tool reads
    database/creds from the Vault database secrets engine (8) and connects to Postgres as the leased user (9).
  width: 1600
  height: 520
