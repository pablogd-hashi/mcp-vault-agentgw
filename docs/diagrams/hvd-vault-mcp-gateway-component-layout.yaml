  - boundary: {name: backend-net, x: 640, y: 100, w: 600, h: 460, label: backend-net}
  - boundary: {name: telemetry-net, x: 660, y: 430, w: 860, h: 170, label: telemetry-net}
  - conn: {name: model, pts: [[476, 194], [154, 194]], label: host.docker.internal, at: [258, 180], label_anchor: middle, mono: true, from: agent, to: ollama}
  - conn: {name: tool-calls, pts: [[524, 194], [721, 194]], from: agent, to: agentgateway}
  - conn: {name: identity-token, pts: [[500, 248], [500, 334], [721, 334]], label: identity token, at: [590, 320], label_anchor: middle, from: agent, to: vault}
