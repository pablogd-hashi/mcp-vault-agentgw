<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" fill="none">
<title>Figure 1: Component layout of the lab</title>
<desc>The host runs Ollama on 127.0.0.1:11434 and the test clients. Docker Compose runs the other components on three networks. The agent joins agent-net only. The MCP server and Postgres join backend-net only. Jaeger joins telemetry-net only and is published on 127.0.0.1:16686. agentgateway, published on 127.0.0.1:13000, and Vault, published on 127.0.0.1:8200, join both agent-net and backend-net. The collector joins all three networks. The agent reaches the gateway, reaches Vault for an identity token, and reaches Ollama through host.docker.internal. The gateway reaches the MCP server with x-api-key. The MCP server reads database/creds from Vault and connects to Postgres. The collector sends spans to Jaeger.</desc>
