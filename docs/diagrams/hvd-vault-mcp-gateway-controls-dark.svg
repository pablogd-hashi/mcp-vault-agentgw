<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" fill="none">
<title>Figure 1: The three controls and where each test scenario stops</title>
<desc>Three columns, one for each decision. In the first column, the agent logs in to Vault with AppRole and gets a five-minute JWT from Vault identity tokens. In the second column, the agent presents the JWT to agentgateway, which runs its token check, its tool rules, and its argument rule. In the third column, inside the backend network, the gateway reaches the MCP server with the upstream key, and the MCP server leases five-minute credentials from Vault and connects to Postgres as the leased user. Numbered badges mark where each test scenario stops: 1 at Postgres, 2 and 4 at the argument rule, 3 at the Vault database credentials, 5 at the backend network and the MCP server, 6 at the gateway, and 7 at the token check and the tool rules.</desc>
<rect id="background" x="0" y="0" width="1600" height="440" fill="#15181E"/>
