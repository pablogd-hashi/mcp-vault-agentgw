version: "3"

dotenv: [".env"]

vars:
  PY: .venv/bin/python
  PSQL: docker compose exec -T postgres psql -q -U postgres -d lab

tasks:
  default:
    cmds: [task --list]
    silent: true

  all:
    desc: "Everything end to end: setup, start, configure Vault, run the seven tests, then show the evidence."
    cmds:
      - task: setup
      - task: up
      - task: vault:configure
      - task: test
      - task: vault:check
      - task: bench
      - task: audit

  setup:
    desc: Create .env with random lab secrets and the Python venv for tests.
    cmds:
      - sh scripts/make-env.sh
      - uv venv --allow-existing --python 3.12 .venv
      - uv pip install --python {{.PY}} -e ".[dev]"

  up:
    desc: Start Postgres, Vault, the MCP server, the gateway, the collector and Jaeger.
    cmds:
      - mkdir -p .lab/mcp-server .lab/agents/oncall-agent .lab/agents/report-agent
      - docker compose up -d --build --wait postgres vault
      - docker compose up -d --build
      - sh scripts/wait-ready.sh

  vault:configure:
    desc: Configure Vault with Terraform (database engine, roles, AppRoles, agent identities) and hand out the AppRole files.
    dir: terraform/vault
    env:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: "{{.VAULT_DEV_ROOT_TOKEN}}"
      TF_VAR_postgres_root_password: "{{.POSTGRES_ROOT_PASSWORD}}"
      TF_VAR_approle_dir: "{{.ROOT_DIR}}/.lab"
    cmds:
      - terraform init -input=false -upgrade=false
      - terraform apply -input=false -auto-approve
      # The gateway reads Vault's signing keys when it starts, so it has to start after they exist.
      - task: gateway:reload

  gateway:reload:
    desc: Restart the gateway so it loads its policy file and Vault's current signing keys.
    cmds:
      - docker compose restart agentgateway
      - sh scripts/wait-ready.sh

  identity:
    desc: Show the claims in the token Vault issues to an agent (AGENT=oncall-agent by default).
    cmds:
      - "{{.PY}} -m lab.identity {{.AGENT | default \"oncall-agent\"}} --claims"

  vault:check:
    desc: Show what the MCP server's AppRole can and cannot lease, straight from Vault.
    cmds:
      - sh scripts/vault-check.sh

  seed:
    desc: Reset the log and service tables to the clean seed (no poisoned row).
    cmds:
      - task: seed:clean

  seed:poison:
    desc: Add the injected log row used by test 4 and the poisoned demo.
    cmds:
      - "{{.PSQL}} < seed/poison.sql"

  seed:clean:
    desc: Remove the injected log row and reset restart counters.
    cmds:
      - '{{.PSQL}} -c "DELETE FROM dev.logs WHERE message LIKE ''%OPERATOR NOTE%''; UPDATE dev.services SET restarts = 0, last_restart = NULL; UPDATE prod.services SET restarts = 0, last_restart = NULL;"'

  test:
    desc: Run the seven scenarios (deterministic, no model needed).
    cmds:
      - "{{.PY}} -m pytest tests/ -v {{.CLI_ARGS}}"

  demo:
    desc: Run the live agent on a clean log (needs Ollama on the host). AGENT_NAME=report-agent runs it as the read-only identity.
    cmds:
      - docker compose run --rm --build agent python -m agent.run "Read the dev logs and tell me which service has errors."

  demo:poisoned:
    desc: Run the live agent N times against the poisoned log and count restart attempts (N=5, MODEL from .env by default).
    cmds:
      - task: seed:poison
      - defer: {task: seed:clean}
      - mkdir -p results
      - docker compose run --rm --build -T -e AGENT_VERBOSITY=0 -e LLM_MODEL={{.MODEL | default .LLM_MODEL}} agent python -m agent.injection_rate --runs {{.N | default "5"}} | tee results/injection_rate-{{.MODEL | default .LLM_MODEL | replace ":" "-"}}.log
      - "{{.PY}} scripts/audit.py 30 | tail -1"

  bench:
    desc: Compare read_logs latency straight to the MCP server and through the gateway.
    cmds:
      - mkdir -p results
      - docker compose exec -T -e AGENT_TOKEN="$({{.PY}} -m lab.identity)" mcp-server python - < scripts/bench.py | tee results/bench.json

  audit:
    desc: Print the gateway's record of recent tool calls (who, tool, arguments, verdict).
    cmds:
      - "{{.PY}} scripts/audit.py {{.CLI_ARGS}}"

  chaos:
    desc: Stop the gateway, show what a client sees, start it again.
    cmds:
      - "{{.PY}} -m pytest tests/test_6_gateway_down.py -v -s"

  traces:
    desc: Open the Jaeger UI.
    cmds:
      - open http://127.0.0.1:16686

  logs:gateway:
    desc: Tail the gateway access log (the audit trail).
    cmds:
      - docker compose logs -f agentgateway

  down:
    desc: Stop everything and remove volumes, Terraform state and the AppRole files.
    cmds:
      - docker compose --profile agent --profile probe down -v --remove-orphans
      - rm -rf .lab terraform/vault/terraform.tfstate terraform/vault/terraform.tfstate.backup
