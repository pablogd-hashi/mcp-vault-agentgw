[project]
name = "mcp-gateway-vault-lab"
version = "0.1.0"
description = "Lab: an MCP gateway decides what an agent may do, Vault limits what the tool behind it can touch."
requires-python = ">=3.12"
dependencies = [
    # Held on 1.x; see mcp-server/requirements.txt.
    "mcp==1.30.0",
    "httpx==0.28.1",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
]

[project.optional-dependencies]
agent = [
    "smolagents[litellm,mcp]==1.26.0",
    "openinference-instrumentation-smolagents==0.1.51",
]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lab*", "agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
